allowBuilds:
  # @parcel/watcher + @swc/core arrive as optional deps of next-intl (its
  # build-time SWC plugin + file watcher), which this setup never uses. Skip
  # their native builds to silence pnpm 11's ERR_PNPM_IGNORED_BUILDS gate so
  # `pnpm install` doesn't exit 1 on CI/Vercel.
  '@parcel/watcher': false
  '@swc/core': false
  '@prisma/engines': true
  # argon2 needs its native build (libargon2 bindings) for the auth
  # password-hashing path that ships in /lib/auth/passwords.ts. Required by
  # the auth surface; CI installs this build in the same pnpm install pass.
  argon2: true
  # esbuild ships with vitest (the test runner snapshotted in /tests) and
  # needs its platform binary at install time.
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
